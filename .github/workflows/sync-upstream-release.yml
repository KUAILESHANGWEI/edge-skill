name: Sync upstream release assets
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: sync-upstream-release
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Mirror the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/sync-upstream-release.sh
